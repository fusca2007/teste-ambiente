[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["."]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache"
]
reportMissingImports = true
reportMissingTypeStubs = false